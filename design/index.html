<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Led NEON | LIGHTSPACE</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header__top">
            <div class="header__spacer"></div>
            <div class="header__logo">
                <a href="/">( Light<span>SPACE</span> )</a>
            </div>
            <div class="header__lang">
                <select class="lang-select">
                    <option value="sl">SL</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </div>
        
        <nav class="nav">
            <ul class="nav__list">
                <li><a href="/led-neon/">Led NEON</a></li>
                <li><a href="/design/">Oblikovanje razsvetljave</a></li>
                <li><a href="/projects/">Projekti</a></li>
                <li><a href="/services/">Storitve</a></li>
                <li><a href="/contact/">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container title-container">
            <h1 class="page-title">Led NEON</h1>
        </div>

        <section class="grey-showcase">
            <div class="container showcase-grid">
                
                <div class="showcase-card">
                    <img src="https://via.placeholder.com/400x400/eeeeee/999999?text=FOTO+1" alt="Led neonski napisi" class="card-img">
                    <div class="card-title">Led neonski napisi</div>
                </div>

                <div class="showcase-card">
                    <img src="https://via.placeholder.com/400x400/eeeeee/999999?text=FOTO+2" alt="Svetlobne table" class="card-img">
                    <div class="card-title">Svetlobne table</div>
                </div>

                <div class="showcase-card">
                    <img src="https://via.placeholder.com/400x400/eeeeee/999999?text=FOTO+3" alt="Zelene stene" class="card-img">
                    <div class="card-title">Zelene stene</div>
                </div>

            </div>
        </section>

        <section class="fullwidth-gallery">
            <img src="https://via.placeholder.com/600x400/333333/ffffff?text=Barber+Neon" alt="Gallery 1">
            
            <img src="https://via.placeholder.com/600x400/444444/ffffff?text=Lips+Neon" alt="Gallery 2">
            
            <img src="https://via.placeholder.com/600x400/555555/ffffff?text=Store+Lighting" alt="Gallery 3">
            
            <img src="https://via.placeholder.com/600x400/666666/ffffff?text=Park+Lighting" alt="Gallery 4">
        </section>

    </main>

</body>
</html>
